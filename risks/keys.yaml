section:
  id: sec-risks-keys
  title: Key Custody Risk
  intro: >-
    The risks associated with key custody cover all private keys and key material. However in some
    cases the way a risk manifests or impacts depends on the type of key.

    For example:


    - Validator Keys enable the operator to manage their nodes so compromises have a direct impact
    on operations, which is very likely to have a financial and reputational impact.

    - Withdrawal Keys enable the operator to manage their digital assets so compromises often have a
    direct financial impact, as well as a likely reputational impact.
