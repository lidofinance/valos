section:
  id: sec-controls-info-secrets
  title: Controls for Information and Secret Management
controls:
  - title: Key Management
    headingId: ctrl-key-management
    requirements:
      - id: req-manage-keys
        statement: Node Operators MUST implement appropriate key management procedures
        after: >-
          Best practice includes following a commonly recognized key management standard such as


          - [[?CCSS]]: a set of requirements for securing Cryptocurrency systems, focusing on Key
          Management. Certification for systems is available at three levels, and is granted by
          certified CCSS Auditors.

          - [[?KMS]]: a set of requirements for Key Management designed for organizations working in
          blockchain, allowing self-attestation of conformance.
    info:
      - heading: Key management helps address the following risks
        level: 5
        entries:
          - text: "* All [Key Custody risks](#sec-risks-keys)"
          - risks:
              - HCK1
              - HCK2
              - HCK3
              - HCK4
            bullet: "*"
  - title: Manage Information Lifecycles
    headingId: ctrl-manage-information-lifecycles
    requirements:
      - id: req-manage-information-lifecycle
        statement: Node Operators MUST document and follow information lifecycle processes for important
          operational information
        after: This includes the definition and enforcement of retention periods, and the use of thorough
          deletion mechanisms, such as [shred](https://man.archlinux.org/man/shred.1.en).
    info:
      - heading: Relevant external controls for information lifecycles
        level: 5
        entries:
          - external:
              standard: ISO27001
              ref: Annex A 8.10
            bullet: "*"
      - heading: Information Lifecycle management helps address the following risks
        level: 5
        entries:
          - risks:
              - SLS10
            bullet: "*"
          - risks:
              - DOW17
            bullet: "*"
  - title: Backup and Protect Data against Loss
    headingId: ctrl-backup-and-protect-data-against-loss
    requirements:
      - id: req-backup-daily
        statement: Node Operators MUST implement backup procedures, at minimum daily, for important
          operational data
      - id: req-journal-backups
        statement: Backup Procedures SHOULD produce journaled backups covering relevant retention periods
      - id: req-protect-against-deletion
        statement: Node Operators MUST implement protection against accidental or malicious deletion of data
        after: These requirements cover all information required by controls in this specification.
    info:
      - heading: Protection against information loss helps address the following risks
        level: 5
        entries:
          - risks:
              - FIN6
            bullet: "*"
          - risks:
              - SLS4
              - SLS10
              - SLS11
              - SLS12
            bullet: "*"
          - risks:
              - KEC6
              - KEC9
            bullet: "*"
          - risks:
              - HCK2
              - HCK4
            bullet: "*"
          - risks:
              - GIR4
              - GIR13
            bullet: "*"
          - risks:
              - RER1
              - RER3
            bullet: "*"
  - title: Record Important Operational Knowledge
    headingId: ctrl-record-important-operational-knowledge
    requirements:
      - id: req-maintain-records
        statement: Node Operators MUST record and maintain important operational information
        after: Best practice is to use a documentation management system. While this is likely to have
          different levels of access control, it is important that no information is available to
          only one employee.
    info:
      - heading: Recording operational knowledge helps address the following risks
        level: 5
        entries:
          - risks:
              - FIN1
              - FIN5
              - FIN6
            bullet: "*"
          - risks:
              - SLS3
              - SLS4
              - SLS10
              - SLS14
            bullet: "*"
          - risks:
              - DOW1
              - DOW4
              - DOW16
              - DOW18
            bullet: "*"
          - risks:
              - KEC2
              - KEC3
              - KEC6
              - KEC9
              - KEC10
            bullet: "*"
          - risks:
              - HCK4
            bullet: "*"
          - risks:
              - GIR4
              - GIR25
            bullet: "*"
          - risks:
              - SPS0
            bullet: "*"
          - risks:
              - RER1
              - RER3
            bullet: "*"
  - title: Document data retention policy
    headingId: ctrl-document-data-retention-policy
    requirements:
      - id: req-data-retention-policy
        statement: Node Operators MUST have a policy for data retention
        after: >-
          This needs to provide adequate retention to enable historical analysis and checking for
          anomalous patterns,

          while minimizing stored data and ensuring compliance with relevant data protection
          regulation.
    info:
      - heading: Data retention policy helps address the following risks
        level: 5
        entries:
          - risks:
              - FIN6
            bullet: "*"
          - risks:
              - DOW4
              - DOW13
            bullet: "*"
          - risks:
              - GIR4
            bullet: "*"
