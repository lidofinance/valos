<script class="remove">

function clean() {
  const head = document.querySelector(".head");
  const copyright = document.querySelector(".copyright");
  if (head && copyright) head.removeChild(copyright);
}

function RiskTableMitigations() {
  const mitigations = document.querySelectorAll('[id^="sec-mit-"]');

  mitigations.forEach((mitigation) => {
    // Build <li><a href="#id">text</a></li>
    const li = document.createElement("li");
    const link = document.createElement("a");

    link.href = `#${mitigation.id}`;
    link.textContent = mitigation.textContent || "";

    li.appendChild(link);

    // Find containing section safely
    const section = mitigation.closest("section");
    if (!section) return;

    const info = section.querySelector(".info");
    if (!info) return;

    const riskLinks = info.querySelectorAll("a");

    riskLinks.forEach((riskLink) => {
      const hash = riskLink.hash;

      if (!hash) return;

      // Case 1: Individual risk reference (#risk-*)
      if (hash.startsWith("#risk-")) {
        const target = document.querySelector(`${hash} .autofill-mits`);
        if (target) {
          target.appendChild(li.cloneNode(true));
        }
        return;
      }

      // Case 2: "All risks"
      const firstListItem = info.querySelector("li");
      if (firstListItem && firstListItem.textContent === "All risks") {
        const allTargets = document.querySelectorAll(".autofill-mits");
        allTargets.forEach((target) => {
          target.appendChild(li.cloneNode(true));
        });
        return;
      }

      // Case 3: Section-level risk reference (#sec-risks*)
      if (hash.startsWith("#sec-risks")) {
        const sectionTarget = document.querySelector(hash);
        if (!sectionTarget) return;

        const autofillTargets = sectionTarget
          .closest("section")
          ?.querySelectorAll(".autofill-mits");

        if (!autofillTargets) return;

        autofillTargets.forEach((target) => {
          target.appendChild(li.cloneNode(true));
        });
      }
    });
  });
}

function ControlTableSummary() {
  "use strict";

  const controlsTable = document.createElement("table");
  controlsTable.id = "summaryTable";

  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  const headers = [
    "Control Group",
    "Control(s)",
    "Status",
    "Comments",
    "Risks",
    "External Controls",
  ];

  headers.forEach((text) => {
    const th = document.createElement("th");
    th.textContent = text;
    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);
  controlsTable.appendChild(thead);

  const tbody = document.createElement("tbody");

  // Avoid :has() to prevent compatibility warnings
  const allSections = document.querySelectorAll("section:not([id^='controls'])");

  allSections.forEach((section) => {
    if (!section.querySelector("b[id^='req-']")) return;

    const item = section.cloneNode(true);
    const row = document.createElement("tr");

    // -----------------------
    // Control Group column
    // -----------------------

    const groupCell = document.createElement("th");
    groupCell.scope = "row";

    const headingLink = item.querySelector("a[href]");
    const headingText = item.querySelector("b");

    if (headingLink && headingText) {
      const link = document.createElement("a");
      link.href = headingLink.getAttribute('href');
      link.textContent = headingText.textContent || "";
      groupCell.appendChild(link);
    }

    row.appendChild(groupCell);

    // -----------------------
    // Controls column
    // -----------------------

    const controlsCell = document.createElement("td");
    const reqParagraphs = item.querySelectorAll("p");

    const relevantControls = Array.from(reqParagraphs).filter((p) =>
      p.querySelector("[id^='req-']")
    );

    let controlsElement;

    if (relevantControls.length === 1) {
      controlsElement = document.createElement("p");

      const reqLink = relevantControls[0].querySelector("a");
      const boldText = relevantControls[0].querySelector("b");

      if (reqLink && boldText) {
        controlsElement.id = `summ-${reqLink.hash.substring(1)}`;

        const bold = document.createElement("b");
        bold.textContent = boldText.textContent || "";
        controlsElement.appendChild(bold);
      }
    } else {
      controlsElement = document.createElement("ul");

      relevantControls.forEach((p) => {
        const reqLink = p.querySelector("a");
        const boldText = p.querySelector("b");
        if (!reqLink || !boldText) return;

        const li = document.createElement("li");
        li.id = `summ-${reqLink.hash.substring(1)}`;

        const bold = document.createElement("b");
        bold.textContent = boldText.textContent || "";

        li.appendChild(bold);
        controlsElement.appendChild(li);
      });
    }

    if (controlsElement) {
      controlsCell.appendChild(controlsElement);
    }

    row.appendChild(controlsCell);

    // -----------------------
    // Status column
    // -----------------------

    const statusCell = document.createElement("td");
    const select = document.createElement("select");

    select.id = `status-${item.id}`;
    select.name = select.id;

    const statusOptions = [
      { suffix: "NT", label: "Not Tested" },
      { suffix: "P", label: "Implemented" },
      { suffix: "NA", label: "Not Applicable (passes)" },
      { suffix: "PI", label: "Partial / Incomplete (fails)" },
      { suffix: "F", label: "Fails" },
    ];

    statusOptions.forEach(({ suffix, label }) => {
      const option = document.createElement("option");
      option.name = `${item.id}-${suffix}`;
      option.textContent = label;
      select.appendChild(option);
    });

    statusCell.appendChild(select);
    row.appendChild(statusCell);

    // -----------------------
    // Comments column
    // -----------------------

    const commentsCell = document.createElement("td");
    commentsCell.appendChild(document.createElement("textarea"));
    row.appendChild(commentsCell);

    // -----------------------
    // Risks column
    // -----------------------

    const risksCell = document.createElement("td");
    const risksHeader = item.querySelector("[id$='risks']");

    if (risksHeader) {
      const risksList = risksHeader.parentElement?.nextElementSibling;

      if (risksList) {
        risksCell.appendChild(risksList.cloneNode(true));
      } else {
        const fallback = document.createElement("p");
        const bold = document.createElement("b");
        bold.textContent = "All risks";
        fallback.appendChild(bold);
        risksCell.appendChild(fallback);
      }
    }

    row.appendChild(risksCell);

    // -----------------------
    // External Controls column
    // -----------------------

    const externalCell = document.createElement("td");
    const externalHeader = item.querySelector("[id^='relevant']");

    if (externalHeader) {
      const externalList =
        externalHeader.parentElement?.nextElementSibling;

      if (externalList) {
        externalCell.appendChild(externalList.cloneNode(true));
      }
    }

    row.appendChild(externalCell);

    tbody.appendChild(row);
  });

  controlsTable.appendChild(tbody);

  const summaryTarget = document.getElementById("sec-summary-of-controls");
  if (summaryTarget) {
    summaryTarget.appendChild(controlsTable);
  }
}
